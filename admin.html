<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --v900:#082A1B; --v700:#0F5C38; --v500:#16915A; --v300:#5CD08A;
    --crema:#FAF9F5; --tinta:#0E1B14; --gris:#697570; --linea:#E4E8E2;
    --si:#0F6B3F; --si-bg:#E2F5EC;
    --no:#C0392B; --no-bg:#FDECEA;
    --pe:#9A7A00; --pe-bg:#FBF3D2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--crema)}
  body{margin:0;background:var(--crema);color:var(--tinta);
       font:400 16px/1.5 Outfit,system-ui,sans-serif;padding:0 0 60px}
  .env{max-width:640px;margin:0 auto;padding:0 16px}

  /* ===== HERO: solo imagen, proporción fija — igual en móvil y en escritorio ===== */
  .hero{position:relative;width:100%;max-width:640px;margin:0 auto;
    aspect-ratio:16/9;overflow:hidden;
    background:linear-gradient(135deg,var(--v700),var(--v900))}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:center 32%;display:block}

  /* ===== FRANJA CLUB: logo + título, debajo de la imagen ===== */
  .marca-club{display:flex;align-items:center;gap:14px;margin:20px 0 18px}
  .logo-club{width:62px;height:62px;object-fit:contain;background:#fff;
    border-radius:50%;padding:6px;box-shadow:0 4px 14px rgba(8,42,27,.18);
    flex-shrink:0;border:1px solid var(--linea)}
  .marca-club h1{font:800 20px/1.18 Outfit;margin:0;color:var(--tinta);
    text-transform:none;letter-spacing:0}
  .marca-club p{margin:3px 0 0;font:500 13px Outfit;color:var(--gris)}

  h2{font:700 12.5px/1 Outfit;letter-spacing:.08em;color:var(--gris);
    text-transform:uppercase;margin:28px 0 10px}
  .tarjeta{background:#fff;border:1px solid var(--linea);border-radius:18px;padding:18px;
    box-shadow:0 3px 12px rgba(8,42,27,.05)}
  label{display:block;font:600 12.5px Outfit;color:var(--gris);margin:12px 0 5px;
    text-transform:uppercase;letter-spacing:.03em}
  input,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--linea);border-radius:12px;
    font:400 16px Outfit;background:var(--crema);color:var(--tinta)}
  input:focus,textarea:focus{outline:none;border-color:var(--v500);
    box-shadow:0 0 0 3px rgba(22,145,90,.12)}
  textarea{min-height:70px;resize:vertical}
  button{font:600 14.5px Outfit;border-radius:13px;cursor:pointer;border:1.5px solid var(--linea);
    background:#fff;color:var(--tinta);padding:12px 14px;transition:transform .1s}
  button:active{transform:scale(.98)}
  button.pri{background:linear-gradient(135deg,var(--v500),var(--v700));color:#fff;
    border-color:transparent;width:100%;margin-top:16px;padding:15px;
    box-shadow:0 6px 16px rgba(15,92,56,.3);font-weight:700}
  button.sec{width:100%;margin-top:9px}

  .marcador{display:flex;gap:8px;margin-bottom:6px}
  .marcador div{flex:1;background:#fff;border:1px solid var(--linea);border-radius:14px;
    padding:11px 4px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.04)}
  .marcador b{display:block;font:800 25px/1 Outfit}
  .marcador span{font:600 11px Outfit;color:var(--gris);text-transform:uppercase}
  .m-si b{color:var(--si)}.m-no b{color:var(--no)}.m-pe b{color:var(--pe)}

  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--linea);
    border-radius:16px;overflow:hidden;box-shadow:0 3px 12px rgba(8,42,27,.05)}
  td{padding:11px 12px;border-top:1px solid var(--linea);font-size:14.5px;vertical-align:middle}
  tr:first-child td{border-top:0}
  td.acc{text-align:right;white-space:nowrap}
  td.acc button{padding:6px 10px;font-size:12.5px;margin-left:4px;border-radius:9px}
  .nota{display:block;font-size:12.5px;color:var(--gris)}
  .b-SI{background:var(--si-bg);border-color:var(--si-bg);color:var(--si)}
  .b-NO{background:var(--no-bg);border-color:var(--no-bg);color:var(--no)}
  .b-PE{background:var(--pe-bg);border-color:var(--pe-bg);color:var(--pe)}

  .jugadores-admin{display:grid;gap:10px}
  .jugador-admin{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:15px;
    box-shadow:0 3px 10px rgba(8,42,27,.04)}
  .jugador-admin-grid{display:grid;grid-template-columns:1fr 84px;gap:8px}
  .jugador-admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .jugador-admin-actions button{margin:0}
  .btn-peligro{color:var(--no);border-color:#EFC4BE;background:#FFF6F5}
  .btn-desc{color:#fff;background:var(--no);border-color:var(--no)}
  .btn-desc.activo{background:#fff;color:var(--no);border:1.5px solid var(--no)}
  .btn-activo-no{color:var(--pe);border-color:#EEDE9E;background:#FFFCF0}
  .check-activo{display:flex;align-items:center;gap:8px;font:400 13.5px Outfit;
    color:var(--gris);margin:12px 0 0;text-transform:none}

  pre{white-space:pre-wrap;background:#fff;border:1px solid var(--linea);border-radius:16px;
    padding:15px;font:400 13.5px/1.55 Outfit;margin:0;box-shadow:0 3px 10px rgba(8,42,27,.04)}
  .ok{position:fixed;left:16px;right:16px;bottom:18px;background:var(--tinta);color:#fff;
    padding:14px 16px;border-radius:14px;font-size:15px;max-width:608px;margin:0 auto;
    display:none;z-index:20}
  .ok.on{display:block}
  .gate{max-width:360px;margin:8px auto 36px;padding:0 16px;text-align:center}
  .gate h2{margin:0 0 16px;color:var(--tinta);font:700 18px Outfit;letter-spacing:0;
    text-transform:none}

  /* Badge e controlli calendario */
  .badge{display:inline-flex;align-items:center;gap:5px;font:700 11.5px/1 Outfit;padding:5px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
  .b-jornada{background:var(--v900);color:#fff}
  .b-casa{background:var(--si-bg);color:var(--si);border:1px solid rgba(15,107,63,.2)}
  .b-fuera{background:#E8F0FE;color:#1967D2;border:1px solid rgba(25,103,210,.2)}
  .b-aplazado{background:#FDE8E8;color:#C5221F;border:1px solid #F5C2C7;animation:pulso 2s infinite}
  @keyframes pulso{0%,100%{opacity:1}50%{opacity:.7}}
  .cabecera-partido{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:18px 0 6px}
  .titulo-partido{font:800 21px/1.22 Outfit;color:var(--tinta);margin:2px 0 12px}
  .toggle-group{display:flex;gap:8px;margin:6px 0 14px}
  .toggle-btn{flex:1;padding:12px 8px;text-align:center;border-radius:12px;cursor:pointer;border:1.5px solid var(--linea);background:var(--crema);font:700 14px Outfit;color:var(--gris);transition:all .15s}
  .toggle-btn.sel{background:var(--v500);color:#fff;border-color:var(--v500);box-shadow:0 3px 10px rgba(22,145,90,.25)}
  select{width:100%;padding:11px 36px 11px 13px;border:1.5px solid var(--linea);border-radius:12px;font:500 15px Outfit;background:var(--crema);color:var(--tinta);appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23697570' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 12px center;background-size:16px}
  select:focus{outline:none;border-color:var(--v500);box-shadow:0 0 0 3px rgba(22,145,90,.12)}
  .card-aplazado{background:#FFF9EB;border:1.5px solid #FFE082;border-radius:14px;padding:14px;margin-top:14px}
  .card-aplazado-banner{background:#FDECEA;border:1.5px solid #F5C2C7;border-radius:14px;padding:13px 16px;margin:12px 0 16px;display:flex;gap:12px;align-items:flex-start}
  .card-aplazado-banner h3{margin:0 0 3px;font:800 16px Outfit;color:#C0392B}
  .card-aplazado-banner p{margin:0;font:400 13.5px Outfit;color:#697570}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid-jornada{display:grid;grid-template-columns:90px 1fr;gap:10px}
  .ayuda-cal{font-size:12.5px;color:var(--gris);margin:4px 0 10px;line-height:1.35}

  /* ===== CONTADOR DE VISITAS ===== */
  .contador-visitas{position:absolute;top:12px;right:12px;z-index:5;
    display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;
    background:rgba(8,42,27,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    color:#fff;font:600 12px/1 Outfit;box-shadow:0 2px 10px rgba(0,0,0,.18)}
  .contador-visitas svg{width:13px;height:13px;flex-shrink:0;opacity:.9}

  /* ===== PIE DE PÁGINA ===== */
  .pie-app{max-width:640px;margin:28px auto 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    text-align:center;border-top:1px solid var(--linea)}
  .pie-app p{margin:0;font:500 11.5px/1.5 Outfit;color:var(--gris);letter-spacing:.01em}
  .pie-app strong{color:var(--tinta);font-weight:700}
</style>
<script src="api.js"></script>
</head>
<body>

<div class="hero">
  <img src="fondo.jpg" alt="">
  <div class="contador-visitas" id="contadorVisitas" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
    <span id="numVisitas">…</span>
  </div>
</div>

<div class="env">
  <div class="marca-club">
    <img class="logo-club" src="logo.png" alt="Escudo C.F. Sporting de Picanya">
    <div>
      <h1>Convocatorias C.F. Sporting de Picanya</h1>
      <p>Panel del responsable</p>
    </div>
  </div>
</div>

<div id="gate" class="gate">
  <h2>Panel del responsable</h2>
  <input type="password" id="pin" placeholder="PIN" onkeydown="if(event.key==='Enter')entrar()">
  <button class="pri" onclick="entrar()">Entrar</button>
</div>

<div id="app" style="display:none">
  <div class="env" id="cuerpo"></div>
</div>

<footer class="pie-app">
  <p>Created by and property of <strong>Marcello Gambardella</strong> · © <span id="anioPie"></span> · All rights reserved.</p>
</footer>

<div class="ok" id="ok"></div>

<script>
var URL_LOGO='logo.png';
var CLAVE='', D=null;

function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];})}

function entrar(){
  CLAVE=document.getElementById('pin').value.trim();
  google.script.run
    .withSuccessHandler(function(){
      document.getElementById('gate').style.display='none';
      document.getElementById('app').style.display='block';
      cargar();
    })
    .withFailureHandler(function(e){aviso(e.message||'PIN incorrecto');})
    .historial(CLAVE);
}

function cargar(){google.script.run.withSuccessHandler(pintar).convocatoria();}

function pintar(d){
  D=d;
  if(!d.hay){
    var sigNum = d.siguienteJornada || 1;
    var sigMatch = d.calendario ? d.calendario.find(function(c){ return c.jornada === sigNum; }) : null;
    var plantilla = {
      jornada: sigNum,
      rival: sigMatch ? sigMatch.rival : '',
      ubicacion: sigMatch ? (sigMatch.esCasa ? 'CASA' : 'FUERA') : 'CASA',
      fecha: sigMatch ? sigMatch.fecha : '',
      hora: sigMatch && sigMatch.esCasa ? '15:30' : '',
      llegada: sigMatch && sigMatch.esCasa ? '14:45' : '',
      campo: sigMatch && sigMatch.esCasa ? (d.configCasa ? d.configCasa.campo : 'Pol. Municipal de Picanya') : '',
      mapa: sigMatch && sigMatch.esCasa ? (d.configCasa ? d.configCasa.mapa : '') : '',
      camiseta: 'Verde',
      notas: '',
      estadoPartido: 'programado',
      motivoAplazado: ''
    };
    document.getElementById('cuerpo').innerHTML =
      '<div class="marca-club" style="margin-top:0;"><div><h1>Crear nueva convocatoria</h1><p>Selecciona una jornada del calendario o personaliza los datos.</p></div></div>'
      + formPartido(plantilla, true);
    return;
  }

  var p=d.partido,r=d.resumen;
  var filas=d.jugadores.map(function(j){
    return '<tr><td>'+esc(j.nombre)+(j.dorsal?' ('+esc(j.dorsal)+')':'')
      +(j.nota?'<span class="nota">'+esc(j.nota)+'</span>':'')
      +(j.modificado?'<span class="nota">'+esc(j.modificado)+'</span>':'')
      +(j.desconvocado?'<span class="nota" style="color:var(--no);font-weight:700;">Desconvocado para este partido</span>':'')
      +'</td><td class="acc">'
      +'<button class="'+(j.estado==='SI'?'b-SI':'')+'" onclick="cambiar(\''+j.id+'\',\'SI\')">Sí</button>'
      +'<button class="'+(j.estado==='NO'?'b-NO':'')+'" onclick="cambiar(\''+j.id+'\',\'NO\')">No</button>'
      +'<button class="'+(j.estado==='PENDIENTE'?'b-PE':'')+'" onclick="cambiar(\''+j.id+'\',\'PENDIENTE\')">–</button>'
      +'<button class="btn-desc'+(j.desconvocado?' activo':'')+'" onclick="toggleDesconvocado(\''+j.id+'\','+(j.desconvocado?'true':'false')+')">'+(j.desconvocado?'✕ Desc.':'Desconvocado')+'</button>'
      +'</td></tr>';
  }).join('');

  var titUbicacion = p.ubicacion === 'CASA' ? '🏠 EN CASA' : '✈️ FUERA';
  var titRival = p.rival ? (p.ubicacion === 'CASA' ? 'Sporting de Picanya vs ' + esc(p.rival) : esc(p.rival) + ' vs Sporting de Picanya') : 'C.F. Sporting de Picanya';

  document.getElementById('cuerpo').innerHTML=
      '<div class="cabecera-partido">'
    +   (p.jornada ? '<span class="badge b-jornada">Jornada '+esc(p.jornada)+'</span>' : '')
    +   '<span class="badge '+(p.ubicacion==='CASA'?'b-casa':'b-fuera')+'">'+titUbicacion+'</span>'
    +   (p.estadoPartido==='aplazado' ? '<span class="badge b-aplazado">⚠️ APLAZADO / RINVIATO</span>' : '')
    + '</div>'
    + '<div class="titulo-partido">'+titRival+'</div>'
    + (p.estadoPartido==='aplazado'
        ? '<div class="card-aplazado-banner"><div style="font-size:24px">⚠️</div><div><h3>PARTIDO APLAZADO / RINVIATO</h3><p>'+esc(p.motivoAplazado||'Partido aplazado. Nueva fecha pendiente de confirmar.')+'</p></div></div>'
        : '')
    + '<div class="marcador">'
    +   '<div class="m-si"><b>'+r.si+'</b><span>van</span></div>'
    +   '<div class="m-no"><b>'+r.no+'</b><span>no van</span></div>'
    +   '<div class="m-pe"><b>'+r.pendiente+'</b><span>pendientes</span></div>'
    +   '<div><b>'+r.total+'</b><span>plantilla</span></div>'
    + '</div>'
    + '<h2>'+esc(p.fechaLarga)+' · '+esc(p.hora)+' h</h2>'
    + '<table>'+filas+'</table>'
    + '<h2>Mensaje para el grupo</h2>'
    + '<pre id="msg">'+esc(resumenTexto())+'</pre>'
    + '<button class="sec" onclick="copiar()">Copiar mensaje de convocatoria</button>'
    + (p.estadoPartido==='aplazado' ? '<button class="sec btn-peligro" onclick="copiarAvisoAplazado()">⚠️ Copiar aviso de aplazamiento (WhatsApp)</button>' : '')
    + '<a id="linkWa" href="#" target="_blank" rel="noopener"><button class="sec">Abrir WhatsApp</button></a>'
    + '<h2>Datos del partido</h2>'
    + formPartido(p,false)
    + '<h2>Gestión de jugadores</h2>'
    + '<div id="jugadoresAdmin" class="jugadores-admin"></div>'
    + '<button class="sec" onclick="mostrarNuevoJugador()">+ Añadir jugador</button>'
    + '<div id="nuevoJugador" class="tarjeta" style="display:none;margin-top:10px"></div>'
    + '<h2>Historial</h2>'
    + '<div id="hist" class="tarjeta">Cargando…</div>'
    + '<h2>Estadísticas de disponibilidad</h2>'
    + '<div id="stats" class="tarjeta">Cargando…</div>';

  document.getElementById('linkWa').href='https://wa.me/?text='+encodeURIComponent(resumenTexto());
  pintarJugadoresAdmin();
  cargarHistorial();
  cargarEstadisticas();
}

function cargarHistorial(){
  google.script.run.withSuccessHandler(function(h){
    document.getElementById('hist').innerHTML=h.map(function(x){
      var badgeUb = x.ubicacion ? (' · <span style="font-weight:600;' + (x.ubicacion === 'CASA' ? 'color:var(--si)' : 'color:#1967D2') + '">' + (x.ubicacion === 'CASA' ? 'Casa' : 'Fuera') + '</span>') : '';
      var badgeRiv = x.rival ? (' <b>vs ' + esc(x.rival) + '</b>') : '';
      var badgeJor = x.jornada ? ('<b>Jornada ' + esc(x.jornada) + '</b>') : '';
      var badgeApl = x.estadoPartido === 'aplazado' ? ' <span style="color:#C5221F;font-weight:700;">[⚠️ APLAZADO]</span>' : '';
      var badgeAct = x.estado === 'activo' ? ' · <span style="color:var(--si);font-weight:700;">abierta</span>' : '';
      return '<div style="padding:10px 0;border-bottom:1px solid var(--linea);font-size:14.5px;">'
        + (badgeJor ? badgeJor + badgeRiv + badgeUb + badgeApl + '<br>' : '')
        + '<span class="nota">' + esc(x.fechaLarga) + ' · ' + esc(x.campo) + ' — ' + x.si + ' sí / ' + x.no + ' no' + badgeAct + '</span>'
        + '<div style="margin-top:6px;">'
        + '<button type="button" style="padding:4px 9px;font-size:12px;border-radius:8px;" onclick="verPresenciasHistorial(\'' + x.id + '\')">✏️ Ver / Corregir presencias</button>'
        + '</div>'
        + '<div id="presencias_hist_' + x.id + '" style="display:none;margin-top:8px;background:var(--crema);padding:10px;border-radius:12px;"></div>'
        + '</div>';
    }).join('') || '<p class="nota">No hay partidos registrados todavía.</p>';
  }).historial(CLAVE);
}

function cargarEstadisticas(){
  google.script.run.withSuccessHandler(function(dato){
    if(!dato.partidos){
      document.getElementById('stats').innerHTML='<p class="nota">Todavía no hay partidos para calcular estadísticas.</p>';
      return;
    }
    var filas2=dato.jugadores.map(function(j){
      return '<tr>'
        +'<td>'+esc(j.nombre)+(j.dorsal?' ('+esc(j.dorsal)+')':'')+'</td>'
        +'<td>'+j.si+'/'+j.convocatorias+'</td>'
        +'<td>'+j.no+'</td>'
        +'<td>'+j.pendiente+'</td>'
        +'<td><b>'+j.porcentaje+'%</b> <span style="color:var(--no);font-weight:700;font-size:12.5px;">('+j.no+')</span>'
        +(j.desconvocado?' <span style="color:var(--no);font-weight:700;font-size:11px;background:var(--no-bg);padding:2px 6px;border-radius:8px;margin-left:3px;white-space:nowrap;">Desc. '+j.desconvocado+'</span>':'')
        +'</td>'
        +'</tr>';
    }).join('');
    document.getElementById('stats').innerHTML=
      '<p class="nota">Partidos contabilizados: '+dato.partidos+'</p>'
      +'<table><tr><td><b>Jugador</b></td><td><b>Sí</b></td><td><b>No</b></td><td><b>Sin resp.</b></td><td><b>% disp.</b></td></tr>'
      +filas2+'</table>';
  }).estadisticas(CLAVE);
}

function verPresenciasHistorial(idPartido){
  var cont = document.getElementById('presencias_hist_' + idPartido);
  if (!cont) return;
  if (cont.style.display === 'block') {
    cont.style.display = 'none';
    return;
  }
  cont.style.display = 'block';
  cont.innerHTML = '<span class="nota">Cargando jugadores y presencias…</span>';
  google.script.run
    .withSuccessHandler(function(res){
      pintarPresenciasHistorial(idPartido, res);
    })
    .withFailureHandler(function(e){
      cont.innerHTML = '<span class="nota" style="color:var(--no);">' + (e.message || 'Error al cargar') + '</span>';
    })
    .respuestasPartidoHistorial(CLAVE, idPartido);
}

function pintarPresenciasHistorial(idPartido, res){
  var cont = document.getElementById('presencias_hist_' + idPartido);
  if (!cont) return;
  var filas = res.jugadores.map(function(j){
    return '<tr><td>' + esc(j.nombre) + (j.dorsal ? ' (' + esc(j.dorsal) + ')' : '')
      + (j.nota ? '<span class="nota">' + esc(j.nota) + '</span>' : '')
      + '</td><td class="acc">'
      + '<button class="' + (j.estado === 'SI' ? 'b-SI' : '') + '" onclick="cambiarPresenciaHist(\'' + idPartido + '\',\'' + j.id + '\',\'SI\')">Sí</button>'
      + '<button class="' + (j.estado === 'NO' ? 'b-NO' : '') + '" onclick="cambiarPresenciaHist(\'' + idPartido + '\',\'' + j.id + '\',\'NO\')">No</button>'
      + '<button class="' + (j.estado === 'PENDIENTE' ? 'b-PE' : '') + '" onclick="cambiarPresenciaHist(\'' + idPartido + '\',\'' + j.id + '\',\'PENDIENTE\')">–</button>'
      + '</td></tr>';
  }).join('');

  cont.innerHTML = '<div style="margin-bottom:6px;font-size:13px;font-weight:700;">Presencias de este partido:</div>'
    + '<table style="font-size:13.5px;">' + filas + '</table>'
    + '<button class="sec" style="margin-top:6px;padding:6px 10px;font-size:12px;" onclick="cerrarPresenciasHistorial(\'' + idPartido + '\')">Ocultar</button>';
}

function cerrarPresenciasHistorial(idPartido){
  var cont = document.getElementById('presencias_hist_' + idPartido);
  if (cont) cont.style.display = 'none';
}

function cambiarPresenciaHist(idPartido, idJugador, estado){
  google.script.run
    .withSuccessHandler(function(res){
      pintarPresenciasHistorial(idPartido, res);
      aviso('Presencia actualizada ✓');
      cargarEstadisticas();
      cargarHistorial();
    })
    .withFailureHandler(function(e){
      aviso(e.message || 'Error al guardar');
    })
    .cambiarPresenciaHistorial(CLAVE, idPartido, idJugador, estado);
}

function formPartido(p,esNuevo){
  p = p || {};
  var esCasa = (p.ubicacion || 'CASA') === 'CASA';
  var esAplazado = (p.estadoPartido || '') === 'aplazado';

  var optsCal = '<option value="">-- Seleccionar jornada del calendario (1 a 34) --</option>';
  if (D && D.calendario) {
    optsCal += D.calendario.map(function(c){
      var sel = (String(c.jornada) === String(p.jornada)) ? ' selected' : '';
      var ub = c.esCasa ? '🏠 Casa' : '✈️ Fuera';
      return '<option value="' + c.jornada + '"' + sel + '>Jornada ' + c.jornada + ' (' + c.fecha + ') · ' + ub + ' · vs ' + esc(c.rival) + '</option>';
    }).join('');
  }

  var optsRival = '<option value="">-- Buscar rival directo (anticipos o cambios de fecha) --</option>';
  if (D && D.calendario) {
    var rivalsMap = {};
    D.calendario.forEach(function(c){
      if (!rivalsMap[c.rival]) rivalsMap[c.rival] = [];
      rivalsMap[c.rival].push(c);
    });
    var sortedRivals = Object.keys(rivalsMap).sort(function(a,b){ return a.localeCompare(b,'es'); });
    sortedRivals.forEach(function(rName){
      var matches = rivalsMap[rName];
      matches.forEach(function(m){
        var sel = (String(m.jornada) === String(p.jornada) && String(p.rival) === String(m.rival)) ? ' selected' : '';
        optsRival += '<option value="' + m.jornada + '"' + sel + '>' + esc(m.rival) + ' — Jornada ' + m.jornada + ' (' + (m.esCasa ? 'Casa' : 'Fuera') + ' · ' + m.fecha + ')</option>';
      });
    });
  }

  return '<div class="tarjeta">'
    + '<label>📅 Calendario Oficial (34 Jornadas)</label>'
    + '<select id="f_selector_cal" onchange="alElegirCalendario(this.value)">' + optsCal + '</select>'
    + '<p class="ayuda-cal">Elige la jornada para rellenar rival, fecha, campo oficial y horarios automáticamente.</p>'
    + '<label>⚔️ Elegir Rival de la liga (Anticipos / Spostamenti)</label>'
    + '<select id="f_selector_rival" onchange="alElegirCalendario(this.value)">' + optsRival + '</select>'
    + '<div class="grid-jornada">'
    +   '<div><label>Jornada</label><input type="number" id="f_jornada" min="1" max="34" value="' + esc(p.jornada || '') + '" placeholder="Nº"></div>'
    +   '<div><label>Rival</label><input type="text" id="f_rival" value="' + esc(p.rival || '') + '" placeholder="Equipo rival"></div>'
    + '</div>'
    + '<label>¿Dónde jugamos?</label>'
    + '<div class="toggle-group">'
    +   '<button type="button" class="toggle-btn ' + (esCasa ? 'sel' : '') + '" id="btnCasa" onclick="fijarUbicacion(\'CASA\', true)">🏠 EN CASA (Picanya)</button>'
    +   '<button type="button" class="toggle-btn ' + (!esCasa ? 'sel' : '') + '" id="btnFuera" onclick="fijarUbicacion(\'FUERA\', true)">✈️ FUERA DE CASA</button>'
    + '</div>'
    + '<input type="hidden" id="f_ubicacion" value="' + (esCasa ? 'CASA' : 'FUERA') + '">'
    + '<label>Fecha de la convocatoria</label><input type="date" id="f_fecha" value="' + esc(p.fecha || '') + '">'
    + '<div class="grid-2">'
    +   '<div><label>Hora del partido</label><input type="time" id="f_hora" value="' + esc(p.hora || '') + '"></div>'
    +   '<div><label>Hora de llegada</label><input type="time" id="f_llegada" value="' + esc(p.llegada || '') + '"></div>'
    + '</div>'
    + '<label>Campo</label><input type="text" id="f_campo" value="' + esc(p.campo || '') + '" placeholder="Nombre del campo">'
    + '<label>Enlace del mapa</label><input type="url" id="f_mapa" value="' + esc(p.mapa || '') + '" placeholder="https://maps.google.com/...">'
    + '<label>Camiseta</label><input type="text" id="f_camiseta" value="' + esc(p.camiseta || '') + '" placeholder="Verde, blanca, negra...">'
    + '<label>Notas para el equipo</label><textarea id="f_notas" placeholder="Ejemplo: Llegad 45 minutos antes.">' + esc(p.notas || '') + '</textarea>'
    + '<label>Cierre de confirmaciones</label><input type="datetime-local" id="f_cierre" value="' + esc((p.cierre || '').replace(' ', 'T')) + '">'
    + '<div class="card-aplazado">'
    +   '<label style="display:flex;align-items:center;gap:9px;margin:0;cursor:pointer;font-weight:700;color:#B45309;text-transform:none;font-size:14.5px;">'
    +     '<input type="checkbox" id="f_aplazado" ' + (esAplazado ? 'checked' : '') + ' onchange="toggleAplazado(this.checked)">'
    +     '⚠️ Partido aplazado / rinviato'
    +   '</label>'
    +   '<div id="caja_aplazado" style="display:' + (esAplazado ? 'block' : 'none') + ';margin-top:10px;">'
    +     '<label style="margin:4px 0 4px;font-size:12px;color:#B45309;">Motivo o nueva fecha acordada</label>'
    +     '<input type="text" id="f_motivo_aplazado" value="' + esc(p.motivoAplazado || '') + '" placeholder="Ejemplo: Aplazado por lluvia / Pendiente de acordar fecha">'
    +     '<p class="nota" style="color:#B45309;margin-top:4px;">Los jugadores verán el aviso de partido aplazado en la web y podrás enviar el comunicado por WhatsApp.</p>'
    +   '</div>'
    + '</div>'
    + (esNuevo
        ? '<button class="pri" onclick="guardarNuevo()">Publicar y abrir convocatoria</button>'
        : '<button class="pri" onclick="guardar()">Guardar cambios de esta convocatoria</button>')
    + (esNuevo
        ? (D && D.hay ? '<button class="sec" onclick="cargar()">Cancelar y volver</button>' : '')
        : '<button class="sec" onclick="nueva()">Crear nueva convocatoria (siguiente jornada)</button>')
    + '<p class="nota">Crear una nueva convocatoria archiva la actual, conserva su historial y pone a todos los jugadores como pendientes en la nueva.</p>'
    + '</div>';
}

function fijarUbicacion(ub, autoRellenar){
  document.getElementById('f_ubicacion').value = ub;
  var bCasa = document.getElementById('btnCasa');
  var bFuera = document.getElementById('btnFuera');
  var cfg = (D && D.configCasa) ? D.configCasa : {
    horaPartido: '15:30',
    horaLlegada: '14:45',
    campo: 'Pol. Municipal de Picanya',
    mapa: 'https://www.google.es/maps/dir//Polideportivo+Pica%C3%B1a+Piscina,+Ctra.+Picanya+a+Alaqu%C3%A0s,+1,+46210+Picanya,+Valencia/@39.4457561,-0.4467615,663m/data=!3m1!1e3!4m17!1m8!3m7!1s0xd604fd3198d9991:0x53838ae24f25e8ba!2sPolideportivo+Pica%C3%B1a+Piscina!8m2!3d39.4461389!4d-0.4439864!15sCiJwb2xpZGVwb3J0aXZvIG11bmljaXBhbCBkZSBwaWNhbnlhWiQiInBvbGlkZXBvcnRpdm8gbXVuaWNpcGFsIGRlIHBpY2FueWGSAQ5zcG9ydHNfY29tcGxleJoBRENpOURRVWxSUVVOdlpFTm9kSGxqUmpsdlQyMUdXRTVZWkVWT2ExcFdWMnhXTWxOVlZUSmxWazV2VFd0R2JVNUZSUkFC4AEA-gEFCI4EEEQ!16s%2Fg%2F11c1nynm22!4m7!1m0!1m5!1m1!1s0xd604fd3198d9991:0x53838ae24f25e8ba!2m2!1d-0.4439864!2d39.4461389?entry=ttu&g_ep=EgoyMDI2MDkxNi4wIKXMDSoASAFQAw%3D%3D',
    camiseta: 'Verde'
  };

  if (ub === 'CASA') {
    bCasa.classList.add('sel');
    bFuera.classList.remove('sel');
    if (autoRellenar !== false) {
      document.getElementById('f_hora').value = cfg.horaPartido;
      document.getElementById('f_llegada').value = cfg.horaLlegada;
      document.getElementById('f_campo').value = cfg.campo;
      document.getElementById('f_mapa').value = cfg.mapa;
      var cCam = document.getElementById('f_camiseta');
      if (!cCam.value || cCam.value.toLowerCase().indexOf('verde') === -1) {
        cCam.value = 'Verde';
      }
    }
  } else {
    bFuera.classList.add('sel');
    bCasa.classList.remove('sel');
    if (autoRellenar !== false && document.getElementById('f_campo').value === cfg.campo) {
      document.getElementById('f_campo').value = '';
      document.getElementById('f_mapa').value = '';
    }
  }
}

function alElegirCalendario(jornadaNum){
  if (!jornadaNum || !D || !D.calendario) return;
  var jNum = parseInt(jornadaNum, 10);
  var match = D.calendario.find(function(c){ return c.jornada === jNum; });
  if (!match) return;

  document.getElementById('f_jornada').value = match.jornada;
  document.getElementById('f_rival').value = match.rival;
  document.getElementById('f_fecha').value = match.fecha;

  var selCal = document.getElementById('f_selector_cal');
  if (selCal) selCal.value = match.jornada;
  var selRiv = document.getElementById('f_selector_rival');
  if (selRiv) selRiv.value = match.jornada;

  fijarUbicacion(match.esCasa ? 'CASA' : 'FUERA', true);

  if (match.fecha) {
    var p = match.fecha.split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    d.setDate(d.getDate() - 2);
    var mes = String(d.getMonth() + 1).padStart(2, '0');
    var dia = String(d.getDate()).padStart(2, '0');
    document.getElementById('f_cierre').value = d.getFullYear() + '-' + mes + '-' + dia + 'T20:00';
  }
}

  var c = document.getElementById('caja_aplazado');

}

  return {

    fecha: v('f_fecha'),
    hora: v('f_hora'),

    campo: v('f_campo'),
    mapa: v('f_mapa'),
    camiseta: v('f_camiseta'),
    notas: v('f_notas'),
    cierre: cierre ? cierre.replace('T', ' ') : '',

  };
}
function v(id){return (document.getElementById(id)?document.getElementById(id).value.trim():'');}

function guardar(){
  google.script.run.withSuccessHandler(function(d){pintar(d);aviso('Partido actualizado ✓');})
    .withFailureHandler(function(e){aviso(e.message);})
    .guardarPartido(CLAVE,datos());
}

function nueva(){
  if(!confirm('¿Archivar la convocatoria actual y preparar una nueva?'))return;
  var sigNum = (D && D.siguienteJornada) ? D.siguienteJornada : 1;
  var sigMatch = (D && D.calendario) ? D.calendario.find(function(c){ return c.jornada === sigNum; }) : null;
  var plantilla = {
    jornada: sigNum,
    rival: sigMatch ? sigMatch.rival : '',
    ubicacion: sigMatch ? (sigMatch.esCasa ? 'CASA' : 'FUERA') : 'CASA',
    fecha: sigMatch ? sigMatch.fecha : '',
    hora: sigMatch && sigMatch.esCasa ? '15:30' : '',
    llegada: sigMatch && sigMatch.esCasa ? '14:45' : '',
    campo: sigMatch && sigMatch.esCasa ? (D.configCasa ? D.configCasa.campo : 'Pol. Municipal de Picanya') : '',
    mapa: sigMatch && sigMatch.esCasa ? (D.configCasa ? D.configCasa.mapa : '') : '',
    camiseta: 'Verde',
    notas: '',
    estadoPartido: 'programado',
    motivoAplazado: ''
  };
  document.getElementById('cuerpo').innerHTML =
    '<h2>Nueva convocatoria (Jornada ' + sigNum + ')</h2>'
    + formPartido(plantilla, true);
  window.scrollTo(0, 0);
}

function guardarNuevo(){
  if(!confirm('¿Confirmar y publicar esta nueva convocatoria para el equipo?'))return;
  google.script.run.withSuccessHandler(function(d){pintar(d);aviso('Nueva convocatoria abierta ✓');})
    .withFailureHandler(function(e){aviso(e.message);})
    .nuevoPartido(CLAVE,datos());
}

function desactivarJugador(id){

function resumenTexto(){
  var p=D.partido;
  if (!p) return '';
  if (p.estadoPartido === 'aplazado') {
    return resumenTextoAplazado();
  }
  function grupo(est){
    return D.jugadores.filter(function(j){return j.estado===est;})
      .map(function(j){return j.nombre+(j.dorsal?' ('+j.dorsal+')':'')+(j.nota?' — '+j.nota:'');});
  }
  var si=grupo('SI'),no=grupo('NO'),pe=grupo('PENDIENTE');
  var titUbicacion = p.ubicacion === 'CASA' ? '🏠 EN CASA' : '✈️ FUERA';
  var titRival = p.rival ? (p.ubicacion === 'CASA' ? 'Sporting de Picanya vs ' + p.rival : p.rival + ' vs Sporting de Picanya') : '';

  return '📋 Convocatoria C.F. Sporting de Picanya\n'
   +(p.jornada ? '🏆 Jornada ' + p.jornada + ' · ' + titUbicacion + '\n' : '')
   +(titRival ? '⚔️ ' + titRival + '\n' : '')
   +'📅 '+p.fechaLarga+' – '+p.hora+' h\n'
   +'🕒 Llegada: '+p.llegada+' h\n'
   +'📍 '+p.campo+'\n'
   +(p.mapa ? '🗺️ Ubicación: '+p.mapa+'\n' : '')
   +'👕 Camiseta: '+p.camiseta+'\n'
   +(p.notas ? '💬 Notas: '+p.notas+'\n' : '')
   +'\n✅ Confirmados ('+si.length+'):\n'+(si.length ? si.join('\n') : 'Ninguno todavía')
   +'\n\n❌ No disponibles ('+no.length+'):\n'+(no.length ? no.join('\n') : 'Ninguno')
   +'\n\n⏳ Pendientes ('+pe.length+'):\n'+(pe.length ? pe.join('\n') : 'Ninguno');
}

function resumenTextoAplazado(){
  var p=D.partido;
  if (!p) return '';
  var titUbicacion = p.ubicacion === 'CASA' ? 'EN CASA' : 'FUERA';
  var titRival = p.rival ? (p.ubicacion === 'CASA' ? 'Sporting de Picanya vs ' + p.rival : p.rival + ' vs Sporting de Picanya') : 'Partido de liga';
  return '⚠️ COMUNICADO: PARTIDO APLAZADO ⚠️\n\n'
   +'⚽ C.F. Sporting de Picanya\n'
   +(p.jornada ? '🏆 Jornada ' + p.jornada + ' (' + titUbicacion + ')\n' : '')
   +'⚔️ ' + titRival + '\n'
   +'📅 Fecha prevista: ' + p.fechaLarga + '\n'
   +(p.motivoAplazado ? '📌 Motivo / Estado: ' + p.motivoAplazado + '\n' : '')
   +'\nℹ️ El partido queda aplazado hasta nueva fecha. Se informará con antelación de la fecha de recuperación.';
}

function copiarAvisoAplazado(){
  var t=resumenTextoAplazado();
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){aviso('Aviso de aplazamiento copiado.');},function(){seleccionar();});
  else seleccionar();
}

function copiar(){
  var t=resumenTexto();
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){aviso('Mensaje copiado.');},function(){seleccionar();});
  else seleccionar();
}
function seleccionar(){
  var r=document.createRange();r.selectNodeContents(document.getElementById('msg'));
  var s=window.getSelection();s.removeAllRanges();s.addRange(r);
  aviso('Selecciona y copia el texto.');
}

var tOk;
function aviso(m){
  var o=document.getElementById('ok');o.textContent=m;o.classList.add('on');
  clearTimeout(tOk);tOk=setTimeout(function(){o.classList.remove('on');},4000);
}
